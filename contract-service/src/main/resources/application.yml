# Application server port
server:
  port: 9000

# Database configuration  
app:
  datasource:    url: ${DATABASE_HOST_URL:jdbc:postgresql://localhost:5432/contract}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:guest} 
    driverClassName: org.postgresql.Driver
    hikari:      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      pool-name: ${HIKARI_POOL_NAME:contract-hikari-cp}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      show_sql: true
      hbm2ddl:
        auto: update
      cache:
        use_second_level_cache: false
        use_query_cache: false
        
# Redis cache configuration           
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    password: ${REDIS_PASSWORD:admin}
    port: ${REDIS_PORT:6379}

# Kafka producer and consumer configuration
kafka:
  booking:
    producer:
      bootstrapServers: ${KAFKA_PRODUCER_SERVERS_HOST:http://localhost:9092}
      topic:
        name: ${KAFKA_PRODUCER_TOPIC_NAME:booking-request} 
        replication-factor: ${KAFKA_PRODUCER_REPLICATION_FACTOR:1}
        partitions: ${KAFKA_PRODUCER_PARTITIONS:1}
        key-serializer: ${KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
        value-serializer: ${KAFKA_PRODUCER_VALUE_SERIALIZER:com.safexpress.propeli.contract.integration.kafka.BookingSerializer}
    consumer:
      bootstrapServers: ${KAFKA_CONSUMER_SERVERS_HOST:http://localhost:9092}
      topic: 
        name: ${KAFKA_CONSUMER_TOPIC_NAME:booking-response}
        groupid: ${KAFKA_CONSUMER_TOPIC_GROUP_ID:booking-group}
        key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
        value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER:com.safexpress.propeli.contract.integration.kafka.BookingDeserializer}
                 
# Actuator enpoint management    management:
  endpoints:
    web:
      exposure:
        include: "*"
        
# Log setting    
logging:
  path: logs  level:    root: WARN
    com.safexpress.propeli: INFO
  file: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  

# Other microservice url configuration
booking-service:
  url: ${BOOKING_SERVICE_URL:http://localhost:9001/booking} 
  
  
