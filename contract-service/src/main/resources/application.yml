server:
  port: 9000
  
app:
  datasource:    url: ${DATABASE_HOST_URL:jdbc:postgresql://localhost:5432/contract}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:guest} 
    driverClassName: org.postgresql.Driver
    hikari:      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      pool-name: ${HIKARI_POOL_NAME:contract-hikari-cp}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
    management:
  endpoints:
    web:
      exposure:
        include: "*"
    
logging:
  path: logs  level:    root: WARN
    com.safexpress.propeli: INFO
  file: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  

booking-service:
  url: ${BOOKING_SERVICE_URL:http://localhost:9001/booking} 
  
  
kafka:
  booking:
    producer:
      bootstrapServers: http://localhost:9092
      topic:
        name: booking-request 
        replication-factor: 1
        partitions: 1
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: com.safexpress.propeli.booking.serialization.BookingSerializer
    consumer:
      bootstrapServers: http://localhost:9092
      topic: 
        name: booking-response
        groupid: booking-group
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: com.safexpress.propeli.booking.serialization.BookingDeserializer
