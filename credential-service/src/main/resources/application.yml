# Application server port
server:
  port: 7000

# Database configuration  
app:
  datasource:    url: ${DATABASE_HOST_URL:jdbc:postgresql://localhost:5432/credential}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:guest} 
    driverClassName: org.postgresql.Driver
    hikari:      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      pool-name: ${HIKARI_POOL_NAME:contract-hikari-cp}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      show_sql: true
      hbm2ddl:
        auto: update
      cache:
        use_second_level_cache: false
        use_query_cache: false
        
# Redis cache configuration           
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    password: ${REDIS_PASSWORD:admin}
    port: ${REDIS_PORT:6379}

# Actuator enpoint management    management:
  endpoints:
    web:
      exposure:
        include: "*"
        
# Log setting    
logging:
  path: logs  level:    root: WARN
    com.safexpress.propeli: INFO
  file: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  

  
